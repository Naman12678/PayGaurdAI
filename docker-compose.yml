services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_checkout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-api:
    build: ./core-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/agent_checkout
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  agent-service:
    build: ./agent-service
    # Deliberately NO env_file here — agent-service must never receive
    # DATABASE_URL, RAZORPAY_KEY_ID, or RAZORPAY_KEY_SECRET.
    # Only pass what it legitimately needs.
    environment:
      CORE_API_URL: http://core-api:4000
      PORT: "4100"
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "4100:4100"
    depends_on:
      - core-api

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_CORE_API_URL: http://localhost:4000
        VITE_AGENT_API_URL: http://localhost:4100
    ports:
      - "5173:80"
    depends_on:
      - core-api
      - agent-service

volumes:
  pgdata:
